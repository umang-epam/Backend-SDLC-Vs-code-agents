openapi: 3.1.0
info:
  title: Insurance Frontend Mock Data Schemas
  version: 0.1.0
  description: >-
    Provisional schema-only inventory of all selected mock fixtures. Structures
    merge every observed record, including nested arrays and dictionaries.
    These schemas describe fixture shapes, not verified backend contracts.
    Required fields are included only where nearby declared types or Zod schemas
    support them and the fixtures agree. Declared numeric fields remain numbers
    unless an integer constraint is evidenced. Other integral sample values are
    integers. No exhaustive sample-derived enums, bounds, defaults, closed
    objects, server URLs, security requirements, or personal examples are added.
    Unobserved optional contract fields and custom runtime refinements are not
    expanded; this is not a complete translation of frontend validation rules.
paths: {}
x-scope:
  mode: schemas-only
  source-file-count: 17
  endpoint-policy: >-
    No proposed operations. src/api/bindApi.ts evidences GET /api/quotes,
    GET /api/quotes/{quoteId}, and GET /api/policies, but its list return types
    are bare arrays whereas the selected fixtures are envelopes. These calls
    do not establish fixture response status codes or a matching wire contract.
    Preference API calls are unrelated to the selected fixtures. The route in
    coverage.service.ts is a future-implementation comment, not an active call.
  inference-policy: >-
    All JSON files are parsed with BOM handling. The TypeScript initializer is
    inspected statically, never executed. Missing fields are not treated as
    null. No explicit nulls or heterogeneous primitive types were observed.
    Empty dictionary arrays use item evidence from other entries in the same
    declared dictionary. Examples are omitted to protect credentials and
    personal data. Dictionary keys are not enumerated as user identifiers.
  limitations:
    - User-policy records omit customerId, productId, and namedInsureds required by PolicySchema; a separate sample-derived schema preserves the conflict.
    - The FNOL fixture lacks claimReference required by FNOLSubmitResponse; claimService.submitFNOL generates it at runtime, outside the fixture schema.
    - One policy contains a singular vehicle field not declared by PolicySchema; it is preserved as an optional observed property.
    - Referral fixture fields have no associated declared response contract in the inspected API, services, or types; their requiredness is unresolved.
    - Recommendation prefillData is an open record of arbitrary values by contract; observed fields are hints, not exhaustive keys or guaranteed value types.
    - User credentials belong to local mock authentication data, not to the public UserSchema or a proven HTTP response.
    - Date-like and email-like fields remain strings unless explicitly supported by a relevant validator; no date formats are inferred from names alone.
